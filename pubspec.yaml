name: keytype
description: "A new Flutter project."
publish_to: 'https://nemati.ai'
version: 0.0.5+5

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.7.2
  shared_preferences: ^2.5.3
  dio: ^5.8.0+1
  flutter_svg: ^2.0.17
  animated_text_kit: ^4.2.3
  cached_network_image: ^3.4.1
  gap: ^3.0.1
  intl: ^0.20.2
  google_sign_in: ^6.3.0
  bot_toast: ^4.1.3
  google_sign_in_ios: ^5.8.1
  # firebase_core: ^3.12.1  # Removed - using pure OAuth
  path_provider: ^2.1.5
  focus_detector_v2: ^3.1.0+1
  package_info_plus: ^8.3.0
  url_launcher: ^6.3.1
  auto_size_text: ^3.0.0
  animate_do: ^4.2.0
  flutter_spinkit: ^5.2.1
  connectivity_plus: ^6.1.3
  smooth_page_indicator: ^1.2.1
  json_annotation: ^4.9.0
  get_it: ^8.0.3
  google_nav_bar: ^5.0.7
  either_dart: ^1.0.0
  share_plus: ^10.1.4
  pull_to_refresh: ^2.0.0
  shimmer: ^3.0.0
  country_flags: ^3.2.0
  photo_view: ^0.15.0
  permission_handler: ^11.4.0
  device_info_plus: ^11.3.3
  file_picker: ^10.0.0
  image_cropper: ^9.1.0
  readmore: ^3.0.0
  markdown_widget: ^2.3.2+6
  flutter_dotenv: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.8
  json_serializable: ^6.7.1
  change_app_package_name: ^1.5.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/icons/
    - .env


  fonts:
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
    - family: ebrima
      fonts:
        - asset: assets/fonts/ebrima.ttf
        - asset: assets/fonts/ebrimabd.ttf
          weight: 700
    - family: vMed
      fonts:
        - asset: assets/fonts/Vazir-Medium-FD.ttf
